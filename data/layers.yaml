  - id: swim_geomorph
    name: SWIM shallow geomorphology consistency
    role: evidence
    resolution_m: 3000
    source: SWIM, individual dataset
    url: https://swim.psi.edu/SWIM4MIMProducts.php
    status: download manually

  - id: hirise_dtm
    name: HiRISE DTM DTEEC_073578_2155_073077_2155_A01
    role: cost
    resolution_m: 1
    units: m (areoid, tied to MOLA)
    source: HiRISE (University of Arizona / NASA JPL)
    url: https://hirise.lpl.arizona.edu/PDS/DTM/ESP/ORB_073500_073599/ESP_073578_2155_ESP_073077_2155/DTEEC_073578_2155_073077_2155_A01.IMG
    citation: NASA/JPL-Caltech/UArizona
    notes: Copia COG de USGS (CC0), la que usa model/gp/covariates.py - https://astrogeo-ard.s3-us-west-2.amazonaws.com/mars/mro/hirise/controlled/dtm/ESP_073578_2155_ESP_073077_2155/DTEEC_073578_2155_073077_2155_A01.tif
    status: scripted (data/download.py)

  # Capas derivadas del DTM por el planificador (apps/planner/app/traverse/terrain.py).
  # Pendientes con base de 10 m: a 2 m domina el ruido del DTM (ver docs/EXPERIMENTS.md, 2026-11-08).
  - id: terrain_elevation_m
    name: Mean elevation per 10 m cell
    role: cost
    resolution_m: 10
    units: m (areoid)
    source: HiRISE DTM DTEEC_073578_2155_073077_2155_A01 (USGS COG copy)
    url: data/processed/s1094b/terrain_elevation_m.tif
    citation: NASA/JPL-Caltech/UArizona
    notes: Pendiente entre celdas para el costo de caminar. Sin dato fuera de la huella del DTM.
    status: derived (python -m app.traverse.terrain, en apps/planner)

  - id: terrain_slope_max_deg
    name: Maximum slope per 10 m cell (10 m baseline)
    role: cost
    resolution_m: 10
    units: degrees
    source: HiRISE DTM DTEEC_073578_2155_073077_2155_A01 (USGS COG copy)
    url: data/processed/s1094b/terrain_slope_max_deg.tif
    citation: NASA/JPL-Caltech/UArizona
    notes: Decide la exclusion (max_slope_deg de la STM, 20 por defecto; ICES-2025-129).
    status: derived (python -m app.traverse.terrain, en apps/planner)

  - id: terrain_slope_mean_deg
    name: Mean slope per 10 m cell (10 m baseline)
    role: cost
    resolution_m: 10
    units: degrees
    source: HiRISE DTM DTEEC_073578_2155_073077_2155_A01 (USGS COG copy)
    url: data/processed/s1094b/terrain_slope_mean_deg.tif
    citation: NASA/JPL-Caltech/UArizona
    status: derived (python -m app.traverse.terrain, en apps/planner)

  - id: terrain_roughness_m
