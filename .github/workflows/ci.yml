name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: moon ci
    runs-on: ubuntu-latest
    steps:
      # moon necesita el historial completo para saber qué cambió.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # La versión de Bun sale de `packageManager` en package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Entorno de Python (contracts, planner, model)
        run: |
          pip install jsonschema pyyaml
          pip install -e "./planner[dev]" -e "./model[dev]"

      # Instala moon (devDependency de la raíz). Las dependencias de web/ las
      # instala moon antes de correr sus tareas.
      - run: bun install --frozen-lockfile

      # Corre solo las tareas afectadas por los cambios (lint, typecheck, test,
      # build, validate). Los servidores de desarrollo no corren en CI.
      - run: bun run moon ci
