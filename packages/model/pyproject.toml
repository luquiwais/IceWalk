[project]
name = "icewalk-model"
version = "0.1.0"
description = "IceWalk ice model and orbital vision pipeline"
requires-python = ">=3.11,<3.14"
# Núcleo del GP: lo que instala el planificador.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
]

[project.optional-dependencies]
# Visión y lectura de rásters (vision/, gp/covariates.py, gp.craters.red_table_to_grid).
vision = ["rasterio>=1.4", "scikit-image>=0.22"]
dev = ["pytest>=8", "ruff>=0.4", "jsonschema>=4.21", "pyyaml>=6"]
# Solo para la variable de textura (DINOv2). No hace falta para tests ni para la API.
ml = ["torch>=2.2", "timm>=1.0", "huggingface_hub>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vision*", "gp*"]

# Coeficientes del prior regional (gp/regional_fit.json).
[tool.setuptools.package-data]
gp = ["*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
