[project]
name = "icewalk-model"
version = "0.1.0"
description = "IceWalk ice model and orbital vision pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.4",
  "scipy>=1.12",
  "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "jsonschema>=4.21", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vision*", "gp*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
