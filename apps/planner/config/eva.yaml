# Parámetros de la EVA para el planificador. Cada valor lleva su fuente; lo que no tiene respaldo
# va con assumption: true (y en docs/SOURCES.md). Los límites de la misión (duración, reserva,
# tripulación) vienen de la STM, no de acá.

habitat_xy:
  value: [-1200, -900]
  source: Punto de demo; grid.json dice que el hábitat es configurable
  assumption: true
  notes: Metros de la grilla desde el cráter. Es el mismo del planificador mock y de los mocks de la web.

egress_min:
  value: 45
  source: Sin fuente; valor del planificador mock
  assumption: true

ingress_min:
  value: 30
  source: Sin fuente; valor del planificador mock
  assumption: true

sensitive_p_ice:
  value: 0.5
  source: >-
    PRD, protección planetaria: estaciones con hielo probable y actividades que generan calor
    requieren aprobación. "Probable" se lee como P(hielo) > 0.5
  assumption: true

min_station_separation_m:
  value: 50
  source: Media celda de la subgrilla de estaciones (100 m, grid.json)
  assumption: true
  notes: Evita dos estaciones en el mismo punto (por ejemplo, un objetivo fijo y una candidata).

believer_error_m:
  value: 0.15
  source: >-
    Error de una profundidad medida en el GP (CRATER_ERROR_M, 1 px en Dundas et al. 2023). Solo
    se usa para planificar: la estación elegida se trata como medida en su valor esperado
    (kriging believer, Ginsbourger et al. 2010), así la siguiente no cae al lado
  assumption: true
