# Parámetros de la EVA para el planificador. Cada valor lleva su fuente; lo que no tiene respaldo
# va con assumption: true (y en docs/SOURCES.md). Los límites de la misión (duración, reserva,
# tripulación) vienen de la STM, no de acá.

habitat_xy:
  value: [300, -2200]
  source: Decisión del 2026-11-08 (DECISIONS); uno de los hábitats de la simulación con muchos cráteres cerca
  assumption: true
  notes: Metros de la grilla desde el cráter, a ~2.2 km, fuera de la eyecta cercana. Antes era (-1200, -900), el punto del mock. Cuando se toque el contrato de la STM, pasar a `habitat_xy` en la STM.

egress_min:
  value: 45
  source: Sin fuente; valor del planificador mock
  assumption: true

ingress_min:
  value: 30
  source: Sin fuente; valor del planificador mock
  assumption: true

sensitive_p_ice:
  value: 0.5
  source: >-
    PRD, protección planetaria: estaciones con hielo probable y actividades que generan calor
    requieren aprobación. "Probable" se lee como P(hielo) > 0.5
  assumption: true

min_station_separation_m:
  value: 50
  source: Media celda de la subgrilla de estaciones (100 m, grid.json)
  assumption: true
  notes: Evita dos estaciones en el mismo punto (por ejemplo, un objetivo fijo y una candidata).

map_half_m:
  value: 1500
  source: >-
    Sin fuente: tamaño de la ventana del mapa de hielo (GET /maps) alrededor del hábitat. 3 × 3 km
    a 10 m son 90 000 celdas, ~1 s y ~120 kB por capa (docs/plans/planner.md pedía ~3 × 3.5 km)
  assumption: true
  notes: >-
    Lo alcanzable en una EVA de 8 h es casi todo el sitio (~590 000 celdas, ~6.5 s): la ventana se
    amplía solo si el plan pone estaciones más lejos (map_margin_m).

map_margin_m:
  value: 300
  source: >-
    Sin fuente: borde del mapa alrededor de cada estación, opción de decisión o medición, 3 alcances
    del GP (100 m), donde una medición deja de cambiar el mapa (gp.maps.UPDATE_REACH_RANGES)
  assumption: true

believer_error_m:
  value: 0.15
  source: >-
    Error de una profundidad medida en el GP (CRATER_ERROR_M, 1 px en Dundas et al. 2023). Solo
    se usa para planificar: la estación elegida se trata como medida en su valor esperado
    (kriging believer, Ginsbourger et al. 2010), así la siguiente no cae al lado
  assumption: true
