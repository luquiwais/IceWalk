[project]
name = "icewalk-planner"
version = "0.1.0"
description = "IceWalk EVA planner API (FastAPI)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.12",
  "rasterio>=1.4",
  # GP y grilla compartida (packages/model). En CI se instala en el mismo comando.
  "icewalk-model",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "jsonschema>=4.21"]

[tool.uv.sources]
icewalk-model = { path = "../../packages/model", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
